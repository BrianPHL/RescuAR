name: Build RescuAR SMS Gateway APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-sms-gateway/**'
      - '.github/workflows/build-sms-gateway.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-sms-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RescuAR-SMS-Gateway-debug-APK
          path: android-sms-gateway/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
