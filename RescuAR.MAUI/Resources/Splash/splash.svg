    <!-- Overlapping Folded Cyan Loop -->
    <path d="M 220 220 C 260 150 370 180 370 260 C 370 330 300 370 220 400 L 150 400 C 200 330 250 260 290 230 C 320 205 340 230 330 260 C 320 290 280 320 220 370 Z" fill="url(#arGrad)" />

