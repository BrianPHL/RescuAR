    <path d="M 300 210 A 90 90 0 0 1 370 300" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- AR Symbol Base -->
    <!-- Diagonal Leg / Ribbon -->
