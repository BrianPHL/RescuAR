<?xml version="1.0" encoding="utf-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="arGrad" x1="120" y1="360" x2="340" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#078F99" />
